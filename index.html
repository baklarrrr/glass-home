<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="Bakar Home">
  <meta name="description" content="Bakar's glasses home: Claude and Codex sessions from the studio PC, his apps, and games kept apart.">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <!-- YouTube's embedded player needs this page's origin as the referrer of its request (error 153 without it). -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#000000">
  <title>Bakar Home</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-now" data-tab="now" aria-controls="now">Now</button>
      <button class="tab" role="tab" id="tab-work" data-tab="work" aria-controls="work">Work</button>
      <button class="tab" role="tab" id="tab-watch" data-tab="watch" aria-controls="watch">Watch</button>
      <button class="tab" role="tab" id="tab-route" data-tab="route" aria-controls="route">Route</button>
      <button class="tab" role="tab" id="tab-drive" data-tab="drive" aria-controls="drive">Drive</button>
      <button class="tab" role="tab" id="tab-apps" data-tab="apps" aria-controls="apps">Apps</button>
      <button class="tab" role="tab" id="tab-games" data-tab="games" aria-controls="games">Games</button>
      <span id="tabline" class="tabline" aria-hidden="true"></span>
    </nav>
    <span class="side">
      <span id="gbat" class="gbat" hidden aria-label="Glasses battery">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7" width="17" height="10" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="20.2" y="10" width="1.8" height="4" rx=".6"/><rect id="gbatFill" x="4.3" y="8.8" width="13.4" height="6.4" rx="1"/></svg><span id="gbatText"></span>
      </span>
      <span id="bbat" class="gbat" hidden aria-label="Neural Band battery">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="9.5" y="6.5" width="5" height="11" rx="1.4"/></svg><span id="bbatText"></span>
      </span>
      <span class="state" aria-live="polite"><span id="dot" class="dot" aria-hidden="true"></span><span id="stateText"></span></span>
    </span>
  </header>

  <div id="push" class="push" role="status" aria-live="polite" hidden><span class="pushring" aria-hidden="true"></span><p id="pushTitle" class="pushtitle"></p><p id="pushText" class="pushtext"></p></div>
  <main>
    <section id="now" class="pane" role="tabpanel" aria-labelledby="tab-now">
      <p id="nowLine" class="nowline"></p>
      <ol id="nowRows" class="rows now"></ol>
    </section>

    <section id="work" class="pane" role="tabpanel" aria-labelledby="tab-work" hidden>
      <div class="sumline">
        <p id="summary" class="summary"></p>
        <button id="newTask" class="pill new" hidden><span class="plus" aria-hidden="true">+</span>New task</button>
      </div>
      <ol id="rows" class="rows"></ol>
    </section>

    <section id="detail" class="pane" hidden aria-label="Session">
      <div class="dhead">
        <p id="dMeta" class="dmeta"></p>
        <p id="dTitle" class="dtitle"></p>
        <p id="dNow" class="dnow"></p>
        <p id="dAsked" class="dasked"></p>
      </div>
      <div id="dQuestion" class="question" hidden>
        <p class="label">Question for you</p>
        <p id="dQText" class="qtext"></p>
        <div id="dOptions" class="options"></div>
        <p id="dQNote" class="note"></p>
      </div>
      <div class="rwrap">
        <div id="dResult" class="result" tabindex="0" aria-label="Latest from this session"></div>
        <span class="rtrack" aria-hidden="true"><span id="rThumb" class="rthumb"></span></span>
      </div>
      <div id="dActions" class="actions"></div>
    </section>

    <section id="compose" class="pane" hidden aria-label="Message">
      <p id="cTitle" class="ctitle"></p>
      <div id="cPick" class="pick"></div>
      <label class="field">
        <span id="cLabel" class="label">Speak your message</span>
        <textarea id="cText" rows="4" maxlength="2000" autocomplete="off" spellcheck="false"></textarea>
      </label>
      <div class="actions"><button id="cSend" class="btn primary">Review</button></div>
      <div id="cConfirm" class="confirm" hidden>
        <p id="cSummary" class="csummary"></p>
        <p id="cQuote" class="cquote"></p>
        <div class="actions"><button id="cGo" class="btn primary">Send</button><button id="cEdit" class="btn">Edit</button></div>
      </div>
      <p id="cNote" class="note"></p>
    </section>

    <section id="watch" class="pane" role="tabpanel" aria-labelledby="tab-watch" hidden>
      <p id="watchLine" class="nowline"></p>
      <button id="ytFind" class="pill new"><span class="plus" aria-hidden="true">+</span>Search YouTube</button>
      <ol id="watchRows" class="rows"></ol>
    </section>

    <section id="route" class="pane" role="tabpanel" aria-labelledby="tab-route" hidden>
      <p id="routeLine" class="nowline"></p>
      <svg id="routeMap" class="routemap" viewBox="-40 -40 1080 1080" role="img" aria-label="Outline of the route" hidden>
        <path id="routeGlow" class="routeglow" pathLength="1"/>
        <path id="routeTrace" class="routetrace" pathLength="1"/>
        <circle id="routeEnd" class="routeend" r="26"/>
        <g id="routeDot" class="routedot"><circle r="30"/></g>
      </svg>
      <ol id="routeRows" class="rows"></ol>
    </section>

    <section id="drive" class="pane" role="tabpanel" aria-labelledby="tab-drive" hidden>
      <div class="drivehud">
        <svg class="drivearc" viewBox="0 0 360 360" aria-hidden="true">
          <defs>
            <linearGradient id="driveGold" gradientUnits="userSpaceOnUse" x1="348" y1="180" x2="12" y2="180">
              <stop offset="0" stop-color="#a97a3a"/><stop offset="0.55" stop-color="#ffd27a"/><stop offset="1" stop-color="#fff0cc"/>
            </linearGradient>
          </defs>
          <g id="driveTicks" class="driveticks"></g>
          <circle class="drivetrack" cx="180" cy="180" r="168" pathLength="360" stroke-dasharray="270 90" transform="rotate(135 180 180)"/>
          <circle id="driveFill" class="drivefill" cx="180" cy="180" r="168" pathLength="360" stroke-dasharray="0 360" transform="rotate(135 180 180)"/>
          <circle id="driveTrail" class="drivetrail" cx="180" cy="180" r="168" pathLength="360" stroke-dasharray="0 360" transform="rotate(135 180 180)"/>
          <circle id="driveTip" class="drivetip" r="7"/>
        </svg>
        <p class="drivemark">BAKAR STUDIO</p>
        <p id="driveState" class="drivestate">PARKED DEMO</p>
        <div class="driveside drivegear"><b id="driveGear">P</b><span>GEAR</span></div>
        <p id="driveSpeed" class="drivespeed">0</p>
        <p class="driveunit">KM/H</p>
        <div class="driveside driveg">
          <svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="27"/><path d="M30 6v48M6 30h48"/><circle id="driveGDot" class="drivegdot" cx="30" cy="30" r="5"/></svg>
          <span id="driveGVal">0.0 G</span>
        </div>
      </div>
      <button id="driveRun" class="row driverun">Run demo</button>
      <button id="driveLive" class="row driverun">Live head motion</button>
      <p id="driveNote" class="note">Sample numbers, not your car. The screen sleeps while driving.</p>
    </section>

    <section id="play" class="pane" hidden aria-label="Video">
      <div id="ytWrap" class="ytwrap"><div id="ytPlayer"></div></div>
      <div class="playhead">
        <p id="pvTitle" class="pvtitle"></p>
        <p id="pvMeta" class="pvmeta"><span id="pvTime"></span></p>
        <span class="pvtrack" aria-hidden="true"><span id="pvBar" class="pvbar"></span></span>
      </div>
      <div id="pvControls" class="actions pvcontrols">
        <button id="pvBack10" class="btn" aria-label="Back 10 seconds">−10 s</button>
        <button id="pvPlay" class="btn">Pause</button>
        <button id="pvFwd10" class="btn" aria-label="Forward 10 seconds">+10 s</button>
        <button id="pvSpeed" class="btn" aria-label="Playback speed">1×</button>
        <button id="pvDone" class="btn">Back</button>
      </div>
      <p id="pvNote" class="note"></p>
    </section>

    <section id="apps" class="pane" role="tabpanel" aria-labelledby="tab-apps" hidden>
      <ol id="appRows" class="rows"></ol>
    </section>

    <section id="games" class="pane" role="tabpanel" aria-labelledby="tab-games" hidden>
      <ol id="gameRows" class="rows"></ol>
      <p id="gamesNote" class="note wide"></p>
    </section>

    <section id="pair" class="pane center" hidden aria-label="Pairing">
      <h1 id="pTitle"></h1>
      <p id="pCode" class="code"></p>
      <p id="pText" class="subline"></p>
      <button id="pRetry" class="btn primary">Try again</button>
    </section>
  </main>
  <script src="vendor/mqtt.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
