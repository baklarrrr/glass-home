<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="Bakar Drive">
  <meta name="description" content="See GPS speed and heading, plus turns from a linked navigation app.">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#000000">
  <title>Bakar Drive</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta property="og:title" content="Bakar Drive">
  <meta property="og:description" content="See GPS speed and heading, plus turns from a linked navigation app.">
  <meta property="og:image" content="https://baklarrrr.github.io/glass-home/drive/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="A two-tone navigation arrow on a dark green tile.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="hud" class="hud" data-light="dusk" data-mode="speed" data-link="none">
    <header class="top">
      <p class="status" role="status" aria-live="polite"><span id="dot" class="dot" aria-hidden="true"></span><span id="status">Speed unavailable</span></p>
      <p id="clock" class="clock" aria-label="Time"></p>
    </header>

    <section id="turn" class="turn" aria-label="Next turn" hidden>
      <svg id="arrow" class="arrow" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <div class="turntext">
        <p id="toTurn" class="toturn"></p>
        <p id="next" class="next"></p>
      </div>
    </section>

    <section id="pairBox" class="pairbox" aria-label="Pairing code" hidden>
      <p class="plabel">Accept this code on your phone</p>
      <p id="pairCode" class="paircode"></p>
    </section>

    <section id="speedBox" class="speedbox" aria-label="GPS speed">
      <p id="speed" class="speed">—</p>
      <p class="unit"><span>km/h</span><span id="heading" class="heading"></span></p>
    </section>

    <footer class="bottom">
      <p id="arrive" class="arrive"><span id="arriveTime"></span><span id="arriveLeft" class="left"></span></p>
      <p id="trip" class="trip"></p>
    </footer>

    <nav id="controls" class="controls" aria-label="Drive controls" hidden>
      <button id="gpsBtn" class="btn">Start GPS</button>
      <button id="lightBtn" class="btn">Light: Auto</button>
      <button id="linkBtn" class="btn">Details</button>
    </nav>

    <section id="panel" class="panel" role="region" aria-labelledby="panelTitle" hidden>
      <h1 id="panelTitle">Drive details</h1>
      <p id="panelState" class="pstate"></p>
      <p id="panelCode" class="pcode" hidden><span class="plabel">Code of these glasses</span><span id="panelCodeNum"></span></p>
      <p id="panelHelp" class="phelp"></p>
      <p id="panelSpeed" class="phelp"></p>
      <p id="speedWarn" class="phelp" hidden></p>
      <p id="panelQuiet" class="phelp quiet">Your vehicle’s instruments are the reference for driving speed.</p>
      <div class="pbtns">
        <button id="panelUse" class="btn" hidden>Use this phone</button>
        <button id="panelStudio" class="btn">Open Studio Drive</button>
        <button id="panelBack" class="btn">Back</button>
      </div>
    </section>
  </main>
  <!-- app-entry -->
  <script src="runtime/drive-v45-6b45579549937935.js"></script>
  <!-- end-app-entry -->
</body>
</html>
